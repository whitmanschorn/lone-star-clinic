# Runs the same checks a developer runs locally: npm run lint, npm run
# typecheck, npm run test:unit and npx playwright test, plus a smoke test of
# the docker compose stack the README tells a reviewer to start.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # One run per branch: a new push cancels the superseded run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: npm ci
      - run: npm --prefix frontend ci
      # The lint script calls Ruff through backend/.venv, as local runs do.
      - run: python -m venv backend/.venv && backend/.venv/bin/pip install -r backend/requirements-dev.txt
      - run: npm run lint
      - run: npm run typecheck

  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m venv backend/.venv && backend/.venv/bin/pip install -r backend/requirements-dev.txt
      - run: npm run test:unit

  e2e:
    name: API and browser tests
    runs-on: ubuntu-latest
    services:
      # The tests start their own API and frontend (see playwright.config.ts);
      # all they need from outside is Postgres on localhost:5433, the same
      # port the development database uses.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic
          POSTGRES_DB: clinic
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U clinic -d clinic"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: python -m venv backend/.venv && backend/.venv/bin/pip install -r backend/requirements-dev.txt
      # --with-deps installs the browser's system libraries on the bare runner.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      # Traces and screenshots are kept on failure (see playwright.config.ts),
      # so a red run leaves a report that can be opened locally.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # What the README tells a reviewer to run; --wait blocks until every
      # container's healthcheck passes.
      - run: docker compose up --build -d --wait
      # The API answers directly and through the frontend's nginx proxy.
      - run: curl -fsS http://localhost:8000/health
      - run: curl -fsS http://localhost:8080/api/health
      - run: docker compose logs
        if: failure()
