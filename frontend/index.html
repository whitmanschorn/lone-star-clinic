<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#a8521f" />
    <title>Lone Star Clinic</title>
    <!-- Apply the saved (or system) colour scheme before the app loads, so a
         dark-mode user never sees a flash of the light theme. The key and
         attribute are the ones Mantine uses. -->
    <script>
      try {
        var saved = localStorage.getItem('mantine-color-scheme-value')
        var scheme =
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.setAttribute('data-mantine-color-scheme', scheme)
      } catch (error) {
        // No storage access: Mantine falls back to the system setting.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
