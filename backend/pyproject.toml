# Tool configuration only. Dependencies live in requirements*.txt.

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "I",  # import order
    "UP", # modern Python idioms
    "B",  # likely bugs
    "SIM", # simplifications
]

[tool.ruff.lint.per-file-ignores]
# Generated migrations import sqlmodel types even when a revision does not use them.
"migrations/versions/*.py" = ["F401"]
# Clinical notes are prose; wrapping them mid-sentence makes them harder to read.
"app/seed_data.py" = ["E501"]
